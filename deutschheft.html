<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="sync.js" data-home="ul"></script>

<title>Mein Deutschheft – Klasse 2</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#fdf8ee; --ink:#2b2a33; --soft:#6d6a78; --card:#fff; --line:#ece4d3;
  --nomen:#e8553f; --verb:#2f7fd8; --adj:#f2a516; --satz:#3aa36b; --mix:#8a5cd6;
  --ok:#2fa865; --bad:#e04848;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;font-size:19px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header.top h1{font-size:30px;margin:0;line-height:1.1}
header.top .sub{color:var(--soft);font-size:16px}
.totalstars{margin-left:auto;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.section{margin-top:22px}
.section h2{font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.section h2 .dot{width:14px;height:14px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;border-left-width:8px;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile b{font-size:19px}
.tile span{color:var(--soft);font-size:15px}
.tile .st{font-size:20px;letter-spacing:2px;color:#f2a516}
.tile .st i{color:#ddd;font-style:normal}
/* Quiz */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.prog{flex:1;height:14px;background:#eee4cf;border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--accent,var(--satz));width:0;transition:width .3s}
.count{font-weight:700;min-width:48px;text-align:right}
.rule{background:#fff;border:2px dashed var(--accent);border-radius:16px;padding:10px 14px;font-size:16px;margin-bottom:14px}
.rule b{color:var(--accent)}
.qcard{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center}
.qtask{color:var(--soft);font-size:17px;margin-bottom:10px;display:flex;justify-content:center;align-items:center;gap:8px}
.speak{border:none;background:#f3eee2;border-radius:50%;width:36px;height:36px;font-size:18px}
.qmain{font-size:30px;font-weight:700;margin:6px 0 18px;line-height:1.35;word-wrap:break-word}
.qmain .gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);color:var(--accent)}
.qmain .gap.sm{min-width:34px}
.qmain.long{font-size:20px;line-height:1.6;text-align:left;background:#fbf8f1;border-radius:14px;padding:12px 16px}
.sheet .bul{margin:4px 0 4px 30px}
.sheet .boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sheet .box{border:1.5px solid #333;min-height:80px;padding:6px 8px;font-size:14px}
.sheet .tk{border:1.5px solid #333;padding:6px 10px;margin-top:10px;font-style:italic}
.qmain .hl{color:var(--accent);text-decoration:underline;text-decoration-thickness:3px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opt{background:#fbf8f1;border:3px solid var(--line);border-radius:16px;padding:14px 10px;font-size:22px;font-weight:700;min-height:62px}
.opt:hover{border-color:var(--accent)}
.opt{overflow-wrap:anywhere;hyphens:auto}
.opt.ok{background:#e3f6ea;border-color:var(--ok);color:#1d7a45}
.opt.bad{background:#fde6e6;border-color:var(--bad);color:#b42828}
.opt:disabled{cursor:default}
.fb{margin-top:16px;font-size:20px;font-weight:700;min-height:28px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--soft);font-size:16px;margin-top:4px}
.next{margin-top:14px;background:var(--accent);color:#fff;border:none;border-radius:16px;padding:14px 34px;font-size:21px;font-weight:700;display:none}
/* Satzende */
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;font-size:25px;margin:6px 0 18px;line-height:1.6}
.w{background:none;border:none;padding:2px 4px;border-radius:8px;font-size:25px;position:relative}
.w:hover{background:#f3eee2}
.w.end::after{content:" ."; color:var(--accent);font-weight:700}
.w.fixed{cursor:default}
.w.miss{background:#fde6e6}
.w.wrong{background:#fde6e6;text-decoration:line-through}
.solution{font-size:20px;background:#e3f6ea;border-radius:14px;padding:10px;margin-top:10px;display:none}
.check{background:var(--accent);color:#fff;border:none;border-radius:16px;padding:12px 28px;font-size:20px;font-weight:700}
/* End */
.endcard{text-align:center;background:#fff;border:2px solid var(--line);border-radius:22px;padding:28px 18px}
.bigstars{font-size:54px;letter-spacing:6px;color:#f2a516;margin:10px 0}
.bigstars i{color:#ddd;font-style:normal}
.endbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.endbtns button{border-radius:16px;padding:12px 24px;font-size:19px;font-weight:700;border:3px solid var(--accent)}
.endbtns .p{background:var(--accent);color:#fff}
.endbtns .s{background:#fff}
.foot{margin-top:30px;color:var(--soft);font-size:14px;text-align:center}
/* Kopf-Buttons */
.topbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bigbtn{border:none;border-radius:18px;padding:16px 12px;font-size:20px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn.ws{background:#4b6cb7}.bigbtn.games{background:#e2843a}
/* ABC */
.abcpick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.abcw{background:#fbf8f1;border:3px solid var(--line);border-radius:14px;padding:10px 16px;font-size:24px;font-weight:700}
.abcw:disabled{opacity:.25}
.abcrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:58px;border:3px dashed var(--line);border-radius:16px;padding:8px;margin:8px 0}
.abcrow span{background:var(--accent);color:#fff;border-radius:12px;padding:8px 14px;font-size:22px;font-weight:700}
.abcrow span.badw{background:var(--bad)}
.abcrow span.okw{background:var(--ok)}
.reset{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-size:16px}
/* Arbeitsblätter */
.panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:20px}
.chk{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:17px;border-bottom:1px solid #f2ecdf}
.chk input{width:22px;height:22px;accent-color:#4b6cb7}
.chk small{color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:17px}
.row select,.row input[type=text]{font-family:inherit;font-size:17px;padding:6px 10px;border-radius:10px;border:2px solid var(--line)}
.actbtn{background:#4b6cb7;color:#fff;border:none;border-radius:14px;padding:12px 20px;font-size:18px;font-weight:700}
.actbtn.sec{background:#fff;color:#4b6cb7;border:2px solid #4b6cb7}
.sheet{background:#fff;border:1px solid #ccc;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:28px 26px;margin-top:14px;font-family:Helvetica,Arial,sans-serif;color:#222;font-size:16px}
.sheet h4{margin:0;font-size:22px}
.sheet .nm{display:flex;gap:30px;margin:10px 0 18px;color:#555}
.sheet .sec{margin:18px 0 6px;font-weight:700;font-size:17px}
.sheet .ins{color:#555;font-size:14px;margin-bottom:6px}
.sheet .it{margin:6px 0 10px 4px;line-height:1.6}
.sheet .op{color:#777;font-size:14px;margin-left:8px}
.sheet .wl{border-bottom:1px solid #999;height:26px;margin:2px 0}
.sheet .sol{background:#f4f8ef}
.msg{padding:10px 14px;border-radius:12px;background:#fff6dd;margin-top:10px;font-size:16px}
/* Spiele */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gtile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.gtile .em{font-size:46px}
.gtile b{display:block;font-size:20px;margin:4px 0}
.gtile small{color:var(--soft);display:block;margin-bottom:8px}
.coins{font-size:22px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 16px;display:inline-block}
.arena{position:relative;background:linear-gradient(#bfe6ff,#e9f7ff);border-radius:20px;height:460px;overflow:hidden;touch-action:manipulation;user-select:none}
.balloon{position:absolute;font-size:52px;cursor:pointer;transition:transform .1s}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:20px;margin:6px 4px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:0 auto}
.card{aspect-ratio:1;border:none;border-radius:14px;background:#e2843a;font-size:40px;color:transparent}
.card.open{background:#fff;color:inherit;border:3px solid #e2843a}
.card.done{background:#e3f6ea;color:inherit;border:3px solid var(--ok)}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto}
.hole{aspect-ratio:1;border:none;border-radius:50%;background:radial-gradient(#5a3b22 55%,#8b5e3c 57%);font-size:54px}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:480px){.qmain{font-size:25px}.opt{font-size:18px;padding:12px 6px}header.top h1{font-size:25px}}
</style>

<script>
/* Ausgleich für Einbettung (z. B. Google Sites am Handy): nur den wirklich sichtbaren Bereich nutzen */
(function(){
  if (window.self === window.top || !('IntersectionObserver' in window)) return;
  var root = document.documentElement, cb = -1, ct = -1, base = 0, lastH = -1;
  function apply(b, t){
    if (b === cb && t === ct) return; cb = b; ct = t;
    root.style.setProperty('--cut', b + 'px'); root.style.setProperty('--cutT', t + 'px');
    window.__cut = b; window.__cutT = t;
    window.dispatchEvent(new Event('resize'));
  }
  // Spiele mit verschobener Zeichenfläche: Fingerposition passend umrechnen
  ['pointerdown','pointermove','pointerup','pointercancel','wheel','click','contextmenu'].forEach(function(n){
    window.addEventListener(n, function(e){
      if (window.__shiftCanvasY && window.__cutT && e.target && e.target.tagName === 'CANVAS') {
        try { Object.defineProperty(e, 'clientY', { value: e.clientY - window.__cutT, configurable: true }); } catch (x) {}
      }
    }, { capture: true, passive: true });
  });
  function start(){
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:100%;opacity:0;pointer-events:none;z-index:-1';
    document.body.appendChild(p);
    var th = []; for (var i = 0; i <= 100; i++) th.push(i / 100);
    new IntersectionObserver(function(es){
      var e = es[es.length - 1], r = e.intersectionRect, h = e.boundingClientRect.height;
      if (r.height <= 0 || h <= 0) return;
      var max = Math.round(h * 0.6);
      var b = Math.min(max, Math.max(0, Math.round(h - r.bottom)));
      var t = Math.min(max, Math.max(0, Math.round(r.top)));
      // Seite unter einer festen Kopfzeile verschoben? (höchstens 100 px)
      if (Math.abs(h - lastH) > 2) { lastH = h; base = b; } else if (t === 0 && b > base) base = b;
      var hidden = Math.min(100, Math.max(0, base - b));
      apply(b, Math.max(t, hidden > 8 ? hidden : 0));
    }, { threshold: th }).observe(p);
  }
  root.style.setProperty('--cut', '0px'); root.style.setProperty('--cutT', '0px');
  window.__cut = 0; window.__cutT = 0;
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>

const SECS = {nomen:["Nomen","var(--nomen)"],verb:["Verben","var(--verb)"],adj:["Adjektive","var(--adj)"],satz:["Sätze","var(--satz)"],abc:["ABC","#14a3a3"],schreib:["Schreiben","#7a8b2f"],laute:["Laute: Vokale, Umlaute, Zwielaute","#d94f8a"],mix:["Üben und Können","var(--mix)"]};
function artOf(w){ for(const a in ARTIKEL) if(ARTIKEL[a].includes(w)) return a;
  const map={Hund:"der",Blume:"die",Teller:"der",Schule:"die","Käse":"der",Wolke:"die","Mütze":"die",Fenster:"das",Kuchen:"der",Zug:"der",Nase:"die",Garten:"der",Freude:"die",Angst:"die",Turm:"der",Zahn:"der",Wut:"die",Mut:"der",Vogel:"der"}; return map[w]||""; }

/* ---------- Startseite ---------- */
function starsHtml(n){ return "★".repeat(n)+"<i>"+"★".repeat(3-n)+"</i>"; }
function home(){
  stopGame();
  const total = Object.values(memStars).reduce((a,b)=>a+b,0);
  let h = `<header class="top"><div style="font-size:44px">📒</div><div><h1>Mein Deutschheft</h1><div class="sub">Deutsch üben – Klasse 2</div></div>
    <div class="totalstars">⭐ ${total} / ${MODULES.length*3}</div></header>
    <div class="topbtns"><button class="bigbtn ws" onclick="wsScreen()">📝 Arbeitsblätter</button>
    <button class="bigbtn games" onclick="gamesScreen()">🎮 Spiele · 🪙 ${getCoins()}</button></div>`;
  for(const s in SECS){
    h += `<div class="section"><h2><span class="dot" style="background:${SECS[s][1]}"></span>${SECS[s][0]}</h2><div class="grid">`;
    MODULES.filter(m=>m.sec===s).forEach(m=>{
      h += `<button class="tile" style="border-left-color:${SECS[s][1]}" onclick="start('${m.id}')">
        <b>${m.title}</b><span>${m.desc}</span><div class="st">${starsHtml(memStars[m.id]||0)}</div></button>`;
    });
    h += `</div></div>`;
  }
  h += `<div class="foot">Eigene Übungen zu den Themen des Arbeitshefts (Klasse 2). Sterne werden auf diesem Gerät gespeichert.</div>`;
  $("#app").innerHTML = h; window.scrollTo(0,0);
}

/* ---------- Quiz ---------- */
let S = null;
function start(id){
  const m = MODULES.find(x=>x.id===id);
  S = {m, qs:m.gen(), i:0, right:0};
  document.documentElement.style.setProperty("--accent", SECS[m.sec][1]);
  show();
}
function shell(inner){
  const n=S.qs.length;
  $("#app").innerHTML = `<div class="bar"><button class="back" onclick="home()">← Zurück</button>
    <div class="prog"><div style="width:${S.i/n*100}%"></div></div><div class="count">${Math.min(S.i+1,n)}/${n}</div></div>
    <div class="rule">${S.m.rule}</div>${inner}`;
}
function show(){
  if(S.i>=S.qs.length) return finish();
  const q=S.qs[S.i];
  if(q.type==="ende") return showEnde(q);
  if(q.type==="abc") return showAbc(q);
  const mainHtml = esc(q.main).replace("___",`<span class="gap${q.small?' sm':''}" id="gap">&nbsp;</span>`).replace(/\[(.+?)\]/g,'<span class="hl">$1</span>');
  shell(`<div class="qcard pop"><div class="qtask">${esc(q.task)} <button class="speak" title="Vorlesen" onclick="speak(${esc(JSON.stringify(q.task+'. '+q.main.replace(/[\[\]]/g,'')))})">🔊</button></div>
    <div class="qmain${q.long?" long":""}">${q.long?mainHtml.replace(/\n/g,"<br>"):mainHtml}</div>
    <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
    <div class="fb" id="fb"></div><button class="next" id="next" onclick="S.i++;show()">Weiter →</button></div>`);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(btn,q){
  const val=q.options[+btn.dataset.k], ok=val===q.answer;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(q.options[+b.dataset.k]===q.answer) b.classList.add("ok"); });
  const gap=$("#gap"); if(gap){ gap.textContent=q.answer; }
  const fb=$("#fb");
  if(ok){ S.right++; fb.className="fb ok"; fb.innerHTML=pick(["Super! 🎉","Richtig! ⭐","Klasse! 👍","Toll gemacht! 🌟"],1)[0]; }
  else { btn.classList.add("bad"); $(".qcard").classList.add("shake"); fb.className="fb bad";
    fb.innerHTML=`Nicht ganz. Richtig ist: ${esc(q.answer)}`+(q.hint?`<small>${esc(q.hint)}</small>`:""); }
  if(ok && q.hint && S.m.id==="find") fb.innerHTML+=`<small>${esc(q.hint)}</small>`;
  $("#next").style.display="inline-block"; $("#next").focus();
}

/* Satzende */
function showEnde(q){
  const sents=q.text.split("|"); const words=[]; const ends=new Set();
  sents.forEach(s=>{ s.split(" ").forEach(w=>words.push(w)); ends.add(words.length-1); });
  q._words=words; q._ends=ends; q._sel=new Set([words.length-1]);
  shell(`<div class="qcard pop"><div class="qtask">Tippe auf das letzte Wort von jedem Satz. Dort kommt ein Punkt hin.
     <button class="speak" onclick="speak(${esc(JSON.stringify(words.join(' ')))})">🔊</button></div>
    <div class="words">${words.map((w,k)=>`<button class="w${k===words.length-1?' end fixed':''}" data-k="${k}">${esc(w)}</button>`).join("")}</div>
    <button class="check" id="chk">Prüfen</button>
    <div class="fb" id="fb"></div>
    <div class="solution" id="sol">${sents.map(s=>esc(s.charAt(0).toUpperCase()+s.slice(1))+".").join(" ")}</div>
    <button class="next" id="next" onclick="S.i++;show()">Weiter →</button></div>`);
  document.querySelectorAll(".w").forEach(b=>{ const k=+b.dataset.k; if(k===words.length-1) return;
    b.onclick=()=>{ if(q._done) return; q._sel.has(k)?q._sel.delete(k):q._sel.add(k); b.classList.toggle("end"); }; });
  $("#chk").onclick=()=>{
    q._done=true; $("#chk").style.display="none";
    let ok=q._sel.size===ends.size && [...ends].every(e=>q._sel.has(e));
    document.querySelectorAll(".w").forEach(b=>{ const k=+b.dataset.k;
      if(ends.has(k)&&!q._sel.has(k)) b.classList.add("miss","end");
      if(!ends.has(k)&&q._sel.has(k)) b.classList.add("wrong"); });
    const fb=$("#fb");
    if(ok){ S.right++; fb.className="fb ok"; fb.textContent="Super, alle Satzenden gefunden! 🎉"; }

  wortart:"Nomen, Verb oder Adjektiv? Kreise ein.", einl:"Trage die Informationen richtig ein.", test:"Löse die Aufgaben."
};
const WS_NOOPTS = ["zeichen","abcbuch","gegen"];
const WS_NOMAIN = ["vfind"];
let WS = {sel:new Set(["art","plural","abc1"]), per:6, sol:true, title:"Deutsch – Klasse 2", model:null};

function toItem(m,q){
  if(q.type==="ende"){ const s=q.text.split("|"); return {text:s.join(" "), lines:2, sol:s.map(x=>x.charAt(0).toUpperCase()+x.slice(1)+".").join(" ")}; }
  if(q.type==="abc"){ return {text:q.words.join(",   "), slots:q.words.length, sol:abcSort(q.words).join(", ")}; }
  let text = WS_NOMAIN.includes(m.id) ? "" : q.main.replace("___",q.small?"____":"__________");
  const hl = text.match(/\[(.+?)\]/); if(hl) text = text.replace(/[\[\]]/g,"") + `   (Vokal: ${hl[1]})`;
  if(q.extra) text += "   " + q.extra;
  const opts = WS_NOOPTS.includes(m.id) ? null : q.options;
  return {text, opts, sub: m.id==="test"?q.task:null, sol:q.answer};
}
function buildModel(){
  const sections=[];
  MODULES.filter(m=>WS.sel.has(m.id)).forEach(m=>{
    if(m.id==="einl"){ const n=WS.per>=8?2:1; for(let i=0;i<n;i++){ const sc=einlScenario();
        sections.push({title:"Eine Einladung schreiben", instr:WSI.einl, einl:sc, infos:shuffle(einlInfos(sc)).map(x=>x[1])}); } return; }
    let qs=[]; const per = m.special==="ende" ? Math.min(WS.per,4) : WS.per;
    while(qs.length<per){ qs=qs.concat(m.gen()); }
    // doppelte vermeiden
    const seen=new Set(); const items=[];
    for(const q of qs){ const it=toItem(m,q); const key=it.text+(it.sub||""); if(seen.has(key)&&qs.length>per*2) continue; seen.add(key); items.push(it); if(items.length>=per) break; }
    sections.push({title:m.title, instr:WSI[m.id]||"", items});
  });
  WS.model = sections;
}

function makePdf(){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const L=18, W=174, BOTTOM=280; let y=20;
  const need=h=>{ if(y+h>BOTTOM){ doc.addPage(); y=20; } };
  const text=(t,size,style,color,indent=0)=>{ doc.setFont("helvetica",style); doc.setFontSize(size); doc.setTextColor(...color);
    const lines=doc.splitTextToSize(t,W-indent); const lh=size*0.45; need(lines.length*lh);
    lines.forEach(l=>{ doc.text(l,L+indent,y); y+=lh; }); };
  // Kopf
  text(WS.title,20,"bold",[30,30,30]); y+=2;
  doc.setFontSize(12); doc.setFont("helvetica","normal"); doc.setTextColor(90,90,90);
  doc.text("Name: ______________________________",L,y+4); doc.text("Datum: ________________",L+110,y+4); y+=14;
  WS.model.forEach((s,si)=>{
    if(s.einl){ if(y>40){ doc.addPage(); y=20; } y+=2;
      text(`${si+1}. ${s.title}`,15,"bold",[40,60,140]); y+=2;
      s.infos.forEach(x=>{ doc.setFillColor(30,30,30); doc.circle(L+8,y-1.4,1,"F"); text(x,13,"normal",[25,25,25],12); y+=1.2; });
      y+=3; doc.setDrawColor(40); doc.rect(L,y,W,10); doc.setFont("helvetica","italic"); doc.setFontSize(12.5); doc.setTextColor(30,30,30); doc.text(s.instr,L+4,y+6.6); y+=14;
      const bw=(W-6)/2, bh=30; const labels=["Anrede (Liebe ...)","Anlass","Tag + Datum","Uhrzeit","Adresse","Zusatzinformation"];
      labels.forEach((lb,i)=>{ const x=L+(i%2)*(bw+6), yy=y+Math.floor(i/2)*(bh+5); doc.rect(x,yy,bw,bh); doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.text(lb,x+3,yy+6); });
      y+=3*(bh+5); doc.rect(L,y,bw,15); doc.text("Name",L+3,y+6); y+=21;
      doc.setFont("helvetica","italic"); doc.setFontSize(12); doc.setTextColor(60,60,60); doc.text("Schreibe die Einladung nun schön auf.",L,y); y+=2;
      doc.setDrawColor(150); while(y+9<BOTTOM){ y+=9; doc.line(L,y,L+W,y); }
      y=BOTTOM; return; }
    need(20); y+=3;
    text(`${si+1}. ${s.title}`,15,"bold",[40,60,140]);
    text(s.instr,11,"italic",[90,90,90]); y+=2;
    s.items.forEach((it,k)=>{
      if(it.sub) text(it.sub,9.5,"italic",[120,120,120],6);
      let t=`${String.fromCharCode(97+k)})  ${it.text}`;
      text(t,14,"normal",[25,25,25],2);
      if(it.opts) text(`( ${it.opts.join("   /   ")} )`,12,"normal",[110,110,110],8);
      if(it.slots){ need(10); y+=3; doc.setFontSize(12); doc.setTextColor(60,60,60);
        const colW=W/it.slots; for(let i=0;i<it.slots;i++){ doc.text(`${i+1}.`,L+4+i*colW,y); doc.setDrawColor(150); doc.line(L+10+i*colW,y+1,L+colW-2+i*colW,y+1); } y+=6; }
      if(it.lines){ for(let i=0;i<it.lines;i++){ need(10); y+=8; doc.setDrawColor(150); doc.line(L+4,y,L+W,y); } y+=3; }
      y+=3.5;
    });
  });
  if(WS.sol){
    doc.addPage(); y=20; text("Lösungen",18,"bold",[30,30,30]); y+=3;
    WS.model.forEach((s,si)=>{ need(14); y+=2; text(`${si+1}. ${s.title}`,13,"bold",[40,60,140]);
      if(s.einl){ einlSol(s.einl).forEach(([k,v])=>text(`${k}: ${v}`,11.5,"normal",[40,40,40],4)); return; }
      s.items.forEach((it,k)=>text(`${String.fromCharCode(97+k)})  ${it.sol}`,11.5,"normal",[40,40,40],4)); });
  }
  return doc;
}
async function downloadPdf(){
  if(!WS.sel.size){ wsMsg("Bitte mindestens ein Thema auswählen."); return; }
  if(!WS.model){ buildModel(); renderPreview(); }
  if(!window.jspdf){ wsMsg("Der PDF-Baustein konnte nicht geladen werden. Bitte die Seite neu laden."); return; }
  const d=new Date(); const name=`Arbeitsblatt-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.pdf`;
  let dl=null; try{ dl = window.claude ? await claude.use("downloads") : null; }catch(e){}
  if(!dl){
    // Eigenständige Webseite (z. B. Netlify / Google Sites): normaler Browser-Download
    try{
      const doc=makePdf(); doc.save(name);
      const url=doc.output("bloburl");
      wsMsg(`✅ Das PDF wird heruntergeladen. Klappt es nicht? <a href="${url}" target="_blank" rel="noopener">PDF in neuem Tab öffnen</a> und dort drucken oder speichern.`);
    }catch(e){ wsMsg("Das PDF konnte nicht erstellt werden. Bitte die Seite neu laden."); }
    return;
  }
  try{
    const buf=makePdf().output("arraybuffer");
    await dl.save({filename:name,data:buf}); wsMsg("✅ Das Arbeitsblatt wurde gespeichert.");
  }catch(e){ if(e&&e.code==="declined") wsMsg("Download abgebrochen."); else wsMsg("Das Speichern hat nicht geklappt. Bitte nochmal versuchen."); }
}

      if(a.textContent===c.textContent){ a.className=c.className="card done"; open=[]; found++; $("#fd").textContent=found;
        if(found===8) gameTimers.push(setTimeout(()=>gameEnd("memory",moves,`Geschafft in ${moves} Zügen!`),600)); }
      else { lock=true; gameTimers.push(setTimeout(()=>{ a.classList.remove("open"); c.classList.remove("open"); open=[]; lock=false; },800)); } }
  });
}
function gameMaulwurf(){
  let score=0, left=30;
  $("#app").innerHTML=gameHeader("maulwurf")+`<div class="hud"><span>⭐ <span id="sc">0</span></span><span>⏱️ <span id="tm">30</span></span></div>
    <div class="holes">${Array.from({length:9},(_,k)=>`<button class="hole" data-k="${k}"></button>`).join("")}</div>`;
  const holes=[...document.querySelectorAll(".hole")];
  holes.forEach(h=>h.addEventListener("pointerdown",e=>{ e.preventDefault(); if(h.dataset.on==="1"){ h.dataset.on="0"; score+=h.dataset.g==="1"?3:1; $("#sc").textContent=score; h.textContent="💫"; setTimeout(()=>{ if(h.dataset.on!=="1") h.textContent=""; },250); } }));
  const pop=()=>{ const free=holes.filter(h=>h.dataset.on!=="1"); if(!free.length) return; const h=free[Math.floor(Math.random()*free.length)];
    const gold=Math.random()<.12; h.dataset.on="1"; h.dataset.g=gold?"1":"0"; h.textContent=gold?"🌟":"🐹";
    const stay=Math.max(500,1000-(30-left)*15);
    gameTimers.push(setTimeout(()=>{ if(h.dataset.on==="1"){ h.dataset.on="0"; h.textContent=""; } },stay)); };
  gameTimers.push(setInterval(pop,650));
  gameTimers.push(setInterval(()=>{ left--; $("#tm").textContent=left; if(left<=0) gameEnd("maulwurf",score,`${score} Punkte!`); },1000));
}

home();
</script>
